# Copy into Streamlit Cloud > Settings > Secrets. Never commit real credentials.
# Replace the sample TURN service with credentials from your chosen provider.
# The browser receives ICE credentials; prefer short-lived credentials.
[webrtc]
# Cloudflare: uncomment both values to generate temporary ICE credentials.
# cloudflare_turn_key_id = "REPLACE"
# cloudflare_turn_api_token = "REPLACE"
# relay_only = true
ice_servers = [
  { urls = ["stun:stun.l.google.com:19302"] },
  # { urls = ["turn:YOUR-TURN-SERVER:3478"], username = "REPLACE", credential = "REPLACE" }
]
